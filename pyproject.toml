[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-localization"
version = "0.1.0"
description = "Reproducible simulation and learning pipeline for 2-D multi-speaker localization"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "pyroomacoustics>=0.7.7",
  "torch>=2.2",
  "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
demo = ["streamlit>=1.40"]

[project.scripts]
voice-localization = "voice_localization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
